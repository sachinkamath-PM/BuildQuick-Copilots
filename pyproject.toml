[project]
name = "parallel-copilots"
version = "0.9.0"
description = "Shared contextual chat foundation for Tyche, Plutus, and Nous"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.22,<1",
  "pypdf>=6.0,<7",
  "pydantic>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.42,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
