name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements.lock && python -m pip install 'pytest>=9,<10'
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --tag buildquick-copilots:${{ github.sha }} .
      - name: Scan production image
        uses: anchore/scan-action@v7
        with:
          image: buildquick-copilots:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
